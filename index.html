<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Sensitivity Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
}

header{
background:#ff6600;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.hero{
text-align:center;
padding:40px 20px;
}

.hero h1{
font-size:35px;
color:orange;
}

.hero p{
margin-top:10px;
color:#ccc;
}

.btn{
display:inline-block;
margin-top:20px;
padding:15px 30px;
background:orange;
color:white;
text-decoration:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
}

.container{
width:90%;
max-width:500px;
margin:30px auto;
background:#1a1a1a;
padding:20px;
border-radius:10px;
box-shadow:0 0 20px orange;
}

input,select,button{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
background:orange;
color:white;
font-weight:bold;
cursor:pointer;
}

#result{
margin-top:20px;
background:#222;
padding:15px;
border-radius:10px;
display:none;
}

footer{
margin-top:40px;
padding:15px;
text-align:center;
background:#111;
color:#aaa;
}
</style>
</head>

<body>

<header>
🔥 FF Sensitivity Pro
</header>

<section class="hero">
<h1>Best Free Fire Sensitivity</h1>
<p>Generate the best sensitivity settings for your device.</p>
<a href="#generator" class="btn">Generate Now</a>
</section>

<div class="container" id="generator">

<input type="text" id="device" placeholder="Device Name">

<select id="ram">
<option>4GB</option>
<option>6GB</option>
<option>8GB</option>
<option>12GB+</option>
</select>

<button onclick="generate()">Generate Sensitivity</button>

<div id="result"></div>

</div>

<footer>
© 2026 FF Sensitivity Pro
</footer>

<script>
function generate(){

let ram=document.getElementById("ram").value;

let text="";

if(ram=="4GB"){
text="<b>General:</b>180<br><b>Red Dot:</b>150<br><b>2X Scope:</b>130<br><b>4X Scope:</b>110<br><b>Sniper:</b>60<br><b>Free Look:</b>67";
}

else if(ram=="6GB"){
text="<b>General:</b>195<br><b>Red Dot:</b>170<br><b>2X Scope:</b>150<br><b>4X Scope:</b>130<br><b>Sniper:</b>65<br><b>Free Look:</b>67";
}

else{
text="<b>General:</b>200<br><b>Red Dot:</b>180<br><b>2X Scope:</b>160<br><b>4X Scope:</b>140<br><b>Sniper:</b>70<br><b>Free Look:</b>67";
}

document.getElementById("result").style.display="block";
document.getElementById("result").innerHTML="<h3>Recommended Settings</h3><br>"+text;

}
</script>

</body>
</html>
